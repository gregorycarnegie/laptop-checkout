<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Laptop Library</title>
    <link data-trunk rel="icon" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link data-trunk rel="css" href="style/main.css" />
    <link data-trunk rel="rust" data-wasm-opt="0" />
  </head>
  <body>
    <div id="boot" class="boot">Opening the loan ledger…</div>
    <noscript>Laptop Library needs JavaScript and WebAssembly to run.</noscript>
    <script>
      // If the app hasn't started after 12 s (e.g. WebAssembly is blocked), say so.
      setTimeout(function () {
        var boot = document.getElementById("boot");
        if (boot) {
          boot.textContent =
            "Laptop Library couldn't start. It needs a current version of Chrome, Edge, Firefox or Safari with WebAssembly allowed.";
        }
      }, 12000);
    </script>
  </body>
</html>
