[package]
name = "laptop-checkout"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Check laptops in and out like library books. Leptos + SQLite, statically hosted, data kept on your own PC."
license = "MIT"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
rusqlite = { version = "0.40", features = ["serialize"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Blob",
  "File",
  "FileList",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlSelectElement",
  "KeyboardEvent",
  "Navigator",
  "Notification",
  "NotificationOptions",
  "NotificationPermission",
  "Location",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
