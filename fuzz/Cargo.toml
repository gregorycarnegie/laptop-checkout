[package]
name = "laptop-checkout-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
laptop-checkout = { path = ".." }

[[bin]]
name = "csv_import"
path = "fuzz_targets/csv_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "date_input"
path = "fuzz_targets/date_input.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of the main workspace.
[workspace]
